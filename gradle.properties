# Type-resolved analysis of engine and integration tests exceeds the default build heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

systemProp.org.gradle.internal.publish.checksums.insecure=true

# Base release used by development builds; official releases override with -Pversion.
baseVersion=0.1.0
