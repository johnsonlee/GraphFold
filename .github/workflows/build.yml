name: Build
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: ./gradlew check :cli:installDist --no-daemon --stacktrace
      - run: cli/build/install/graphfold/bin/graphfold --help
      - run: cli/build/install/graphfold/bin/graphfold --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: '**/build/reports/'
