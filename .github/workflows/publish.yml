name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'v-prefixed SemVer to rehearse locally; publishes nothing remotely'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: version
        run: python3 .github/scripts/release.py version "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and stage all publications
        run: |
          ./gradlew clean check :cli:installDist :cli:distZip :cli:distTar publishAllPublicationsToReleaseVerificationRepository --no-daemon --stacktrace -Pversion="$RELEASE_VERSION"
          python3 .github/scripts/release.py verify build/repository "$RELEASE_VERSION"
          cli/build/install/graphfold/bin/graphfold --help
          python3 .github/scripts/release.py smoke cli/build/distributions "$RELEASE_VERSION"
          mkdir -p release-assets
          cp cli/build/distributions/* release-assets/
          tar -czf release-assets/graphfold-maven-"$RELEASE_VERSION".tar.gz -C build repository
          python3 .github/scripts/release.py checksums release-assets
          (cd release-assets && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-assets/
          if-no-files-found: error
  maven:
    if: github.event_name != 'workflow_dispatch'
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish signed modules and plugin marker to Central
        env:
          GPG_KEY_ARMOR: ${{ secrets.GPG_KEY_ARMOR }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_OSSRH_PACKAGE_GROUP: ${{ secrets.OSSRH_PACKAGE_GROUP }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/graphfold-secring.gpg"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$GPG_KEY_ARMOR" | base64 --decode > "$KEY_FILE"
          ./gradlew publishAllPublicationsToSonatypeRepository closeAndReleaseSonatypeStagingRepository --no-daemon --stacktrace \
            -Pversion="$RELEASE_VERSION" -Psigning.keyId="$ORG_GRADLE_PROJECT_signingKeyId" \
            -Psigning.password="$ORG_GRADLE_PROJECT_signingPassword" -Psigning.secretKeyRingFile="$KEY_FILE"
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [validate, prepare, maven]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-assets
      - name: Verify assets
        run: cd release-assets && sha256sum -c SHA256SUMS
      - name: Publish release with verified assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
