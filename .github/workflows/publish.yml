name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'v-prefixed SemVer to rehearse locally; publishes nothing remotely'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - id: version
        run: python3 .github/scripts/release.py version "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  prepare:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exercise signed publication upload gate
        run: python3 .github/scripts/verify-publication-gate.py
      - name: Verify and stage synchronized engine, compiler and build plugin publications
        run: |
          ./gradlew clean check publishAllPublicationsToReleaseVerificationRepository --no-daemon --stacktrace -Pversion="$RELEASE_VERSION"
          python3 .github/scripts/release.py verify build/repository "$RELEASE_VERSION"
          mkdir -p release-assets
          tar -czf release-assets/graphfold-maven-"$RELEASE_VERSION".tar.gz -C build repository
          python3 .github/scripts/release.py checksums release-assets
          (cd release-assets && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-assets/
          if-no-files-found: error
  maven:
    if: github.event_name != 'workflow_dispatch'
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-assets
      - name: Restore verified publications
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS)
          mkdir verified
          tar -xzf "release-assets/graphfold-maven-$RELEASE_VERSION.tar.gz" -C verified
      - name: Publish signed modules and plugin marker together to Central
        env:
          GPG_KEY_ARMOR: ${{ secrets.GPG_KEY_ARMOR }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_OSSRH_PACKAGE_GROUP: ${{ secrets.OSSRH_PACKAGE_GROUP }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/graphfold-secring.gpg"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$GPG_KEY_ARMOR" | base64 --decode > "$KEY_FILE"
          ./gradlew publishAllPublicationsToReleaseVerificationRepository --no-daemon --stacktrace \
            -Pversion="$RELEASE_VERSION" -Psigning.keyId="$ORG_GRADLE_PROJECT_signingKeyId" \
            -Psigning.password="$ORG_GRADLE_PROJECT_signingPassword" -Psigning.secretKeyRingFile="$KEY_FILE"
          python3 .github/scripts/release.py verify build/repository "$RELEASE_VERSION"
          python3 .github/scripts/release.py compare verified/repository build/repository
          ./gradlew publishAllPublicationsToSonatypeRepository closeAndReleaseSonatypeStagingRepository --no-daemon --stacktrace \
            --init-script .github/scripts/verified-publication.gradle -Dgraphfold.verifiedRepository="$PWD/verified/repository" \
            -Pversion="$RELEASE_VERSION" -Psigning.keyId="$ORG_GRADLE_PROJECT_signingKeyId" \
            -Psigning.password="$ORG_GRADLE_PROJECT_signingPassword" -Psigning.secretKeyRingFile="$KEY_FILE"
  github-packages:
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-assets
      - name: Restore verified publications
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS)
          mkdir verified
          tar -xzf "release-assets/graphfold-maven-$RELEASE_VERSION.tar.gz" -C verified
      - name: Reproduce and compare GitHub Packages publication payloads
        run: |
          ./gradlew publishAllPublicationsToReleaseVerificationRepository --no-daemon --stacktrace -Pversion="$RELEASE_VERSION"
          python3 .github/scripts/release.py verify build/repository "$RELEASE_VERSION"
          python3 .github/scripts/release.py compare verified/repository build/repository
      - name: Rehearse guarded GitHub Packages upload locally
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon --stacktrace \
            --init-script .github/scripts/verified-publication.gradle -Dgraphfold.verifiedRepository="$PWD/verified/repository" \
            -Pversion="$RELEASE_VERSION" -PgithubPackagesRepository="file://$RUNNER_TEMP/github-packages"
          python3 .github/scripts/release.py verify "$RUNNER_TEMP/github-packages" "$RELEASE_VERSION"
          python3 .github/scripts/release.py compare verified/repository "$RUNNER_TEMP/github-packages"
      - name: Publish modules and plugin marker to GitHub Packages
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon --stacktrace \
            --init-script .github/scripts/verified-publication.gradle -Dgraphfold.verifiedRepository="$PWD/verified/repository" \
            -Pversion="$RELEASE_VERSION"
  release:
    if: github.event_name != 'workflow_dispatch'
    needs: [validate, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-assets
      - name: Verify assets
        run: cd release-assets && sha256sum -c SHA256SUMS
      - name: Publish release with verified assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
  publication-summary:
    if: always()
    needs: [validate, prepare, maven, github-packages, release]
    runs-on: ubuntu-latest
    steps:
      - name: Record independent publication results
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          PREPARATION_RESULT: ${{ needs.prepare.result }}
          CENTRAL_RESULT: ${{ needs.maven.result }}
          PACKAGES_RESULT: ${{ needs.github-packages.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          {
            echo '## Publication channels'
            if [ "$DRY_RUN" = true ]; then
              echo 'Dry run: GitHub Packages result covers a local file repository only; nothing was published remotely.'
              echo ''
            fi
            echo '| Channel | Result |'
            echo '| --- | --- |'
            echo "| Validation | $VALIDATION_RESULT |"
            echo "| Preparation | $PREPARATION_RESULT |"
            echo "| Maven Central | $CENTRAL_RESULT |"
            echo "| GitHub Packages | $PACKAGES_RESULT |"
            echo "| GitHub Release | $RELEASE_RESULT |"
            echo ''
            echo 'Failed channels remain failed; independent channels do not wait for them.'
          } >> "$GITHUB_STEP_SUMMARY"
