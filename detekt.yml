# Extend detekt's recommended defaults; one finding fails the build.
config:
  validation: true
  warningsAsErrors: true
build:
  maxIssues: 0
complexity:
  active: true
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 20
exceptions:
  active: true
  SwallowedException:
    active: true
  TooGenericExceptionCaught:
    active: true
potential-bugs:
  active: true
  CastNullableToNonNullableType:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnreachableCode:
    active: true
style:
  active: true
  NoTabs:
    active: true
  TrailingWhitespace:
    active: true
  UnusedImports:
    active: true
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
  MaxLineLength:
    maxLineLength: 140
  WildcardImport:
    active: true
performance:
  active: true
naming:
  active: true
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
